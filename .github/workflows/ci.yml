name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Proceed
        env:
          ACTOR: ${{ github.actor }}
        run: echo "CI proceeding for $ACTOR"

  lint:
    name: Lint & Typecheck
    needs: guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

      - name: Build JavaScript and type declarations
        run: yarn prepare

  test:
    name: Test
    needs: guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Verify offline secret reader
        run: python3 -B .trunk/configs/tests/test_trufflehog_to_sarif.py

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  audit:
    name: Security Audit
    needs: guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Audit production dependencies
        run: yarn npm audit --environment production

  android:
    name: Build Android
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      # Compiles the library against the native SDK that android/build.gradle pins.
      - name: Build example for Android
        env:
          JAVA_OPTS: -XX:MaxHeapSize=6g
        run: yarn example build:android

  ruby:
    name: Ruby dependency checks
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUNDLE_FROZEN: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install locked Ruby dependencies
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: 3.4.1
          bundler: Gemfile.lock
          bundler-cache: true
          working-directory: example

      - name: Exercise CocoaPods and its locked dependencies
        working-directory: example
        run: bundle exec ruby ../scripts/test_ruby_dependencies.rb
